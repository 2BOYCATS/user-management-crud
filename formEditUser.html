<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/modern-normalize@3.0.1/modern-normalize.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined" rel="stylesheet" />
    <link rel="stylesheet" href="styles/formEditUser.css">
    <title>Edit Users</title>
</head>
<body>
    <div class="container">
        <form class="formEditUser" id="formEditUser">
            <strong>Edit User</strong>
            <input type="text" id="firstname" placeholder="First name...">
            <input type="text" id="lastname" placeholder="Last name...">
            <input type="email" id="email" placeholder="Email...">
            <button type="submit" class="edit">Edit</button>
            <button type="button" class="exit" id="exit">X</button>
        </form>
    </div>

    <script src="scripts/edit.js"></script>
</body>
</html>
